  guia:
    activa: true
    antetitulo: Sobre mí
    titulo: Hola, soy Pau
    texto: "Nací en Benasque y llevo toda la vida en estas montañas. Desde 2011 trabajo como guía: primero en refugios y escuelas, y ahora por mi cuenta, con grupos pequeños que quieren ir a la montaña bien acompañados.\n\nMe gusta explicar lo que vemos, cuidar el ritmo de cada uno y volver siempre con todo el grupo. Si la montaña no está para subir, nos damos la vuelta y buscamos otro plan."
    imagen: /fotos/guia-montana.jpg
    items:
      - { titulo: Técnico Deportivo Superior en Alta Montaña, texto: "Titulación oficial para guiar en terreno glaciar, escalada y esquí.", icono: montana }
      - { titulo: Federado en montaña, texto: "Licencia federativa en vigor todos los años.", icono: bandera }
      - { titulo: Seguro de accidentes y responsabilidad civil, texto: "Cada cliente va asegurado durante la actividad.", icono: escudo }
      - { titulo: Primeros auxilios en zonas remotas, texto: "Formación que renuevo cada dos años.", icono: botiquin }

  material:
    activa: true
    antetitulo: Material incluido
    titulo: Lo técnico lo pongo yo
    texto: "No necesitas comprar nada para probar. Llevo el material técnico de cada actividad, revisado y a tu talla."
    nota: "Tú traes botas de montaña, ropa de abrigo, agua y algo de comer. Si te falta algo, pregúntame y te lo dejo."
    items:
      - { titulo: Casco y arnés, texto: "Homologados y ajustados antes de empezar.", icono: casco }
      - { titulo: Cuerdas y mosquetones, texto: "Para escalada, rápeles y glaciar.", icono: cuerda }
      - { titulo: Crampones y piolet, texto: "En las ascensiones con nieve o hielo.", icono: piolet }
      - { titulo: Raquetas y bastones, texto: "En todas las salidas de invierno.", icono: raqueta }
      - { titulo: "Detector, pala y sonda", texto: "Material de avalanchas en cada salida con nieve.", icono: radio }
      - { titulo: Neopreno, texto: "Traje, escarpines y casco para los barrancos.", icono: agua }
      - { titulo: Botiquín y emisora, texto: "Siempre en mi mochila, con el teléfono de rescate.", icono: botiquin }
      - { titulo: Fotos de la salida, texto: "Te las paso el mismo día por WhatsApp.", icono: camara }

  seguridad:
    activa: true
    antetitulo: Seguridad
    titulo: Volver es la cumbre
    texto: "Antes de cada salida miro el parte de montaña y el de aludes, preparo un plan alternativo y te cuento cómo vamos a ir. Estas son las dudas que más me preguntáis."
    preguntas:
      - { pregunta: "¿Qué pasa si hace mal tiempo?", respuesta: "Si el parte no es seguro, cambiamos de actividad o de fecha. Nunca pierdes el dinero por una cancelación por el tiempo." }
      - { pregunta: "¿Cuántas personas lleváis por guía?", respuesta: "Depende de la actividad: hasta ocho en senderismo y raquetas, seis en esquí de travesía y cuatro en terreno glaciar." }
      - { pregunta: "¿Y si no puedo seguir el ritmo?", respuesta: "Ajustamos el ritmo al grupo y en cada ruta hay puntos para darse la vuelta. Nadie se queda solo en la montaña." }
      - { pregunta: "¿Qué seguro tengo durante la actividad?", respuesta: "Todas las actividades incluyen seguro de accidentes y de responsabilidad civil. Si estás federado, me lo dices al reservar." }

  zonas:
    activa: true
    titulo_pagina: "Guía de montaña en {zona}"
    texto_pagina: "Salidas de {negocio} por esta zona del Pirineo, con guía titulado y grupos pequeños."
    antetitulo: Dónde guío
    titulo: Mis montañas
    texto: "Trabajo sobre todo en el valle de Benasque y en los valles vecinos. Para salidas privadas me desplazo a otras zonas del Pirineo."
    items:
      - titulo: Valle de Benasque
        texto: |
          Es mi casa y donde más salidas hago. El valle sube desde Benasque hasta los Llanos del Hospital y ofrece caminos para todos los niveles: paseos tranquilos por el bosque, la entrada a Estós y Vallibierna, y los accesos al macizo de la Maladeta. Desde aquí parten también las salidas de senderismo, raquetas en invierno y buena parte de las ascensiones.

          Si buscas un primer día de montaña, empezamos por aquí: hay refugios, buena señalización y salidas cortas para afinar el plan según el tiempo. Los pueblos cercanos, como Cerler o Castanesa, quedan a un paso para quien quiere combinar actividades.
      - titulo: Macizo de la Maladeta
        texto: |
          La Maladeta es la montaña grande del Pirineo: el Aneto, los glaciares y las crestas de granito que se ven desde el valle. Aquí hago las ascensiones con noche en el refugio, las salidas de glaciar con crampones y piolet y, en invierno, algunas travesías con esquís cuando las condiciones lo permiten.

          Son rutas exigentes que preparo con tiempo: revisamos el parte, el estado de la nieve y el grupo antes de decidir el día. El acceso se hace desde el valle de Benasque, por los Llanos del Hospital y el refugio de La Renclusa. Si quieres subir al techo del Pirineo, empieza por contarme qué has caminado hasta ahora.
      - titulo: Posets
        texto: |
          El Posets es otra gran cumbre del Pirineo y tiene un carácter muy distinto al de la Maladeta: más alpino, con ibones de aguas verdes, circos de roca y una ascensión larga que se disfruta mucho. Subimos por la zona de Batisielles y Eriste, con opción de noche en refugio para llegar descansados.

          Es un destino perfecto para quien quiere una ascensión importante sin la presión del glaciar. También hago salidas más suaves hasta los ibones, ideales para grupos o familias con ganas de andar. Hablamos de tu nivel y elegimos la ruta que mejor encaje con la temporada.
      - titulo: Cerler y Castanesa
        texto: |
          Cerler y Castanesa son mi zona para la escalada, las raquetas de nieve y el esquí de travesía. Las paredes de roca están cerca del pueblo, así que se llega pronto y se aprovecha toda la jornada; en invierno, las laderas de Cerler ofrecen buena nieve para subir con pieles y paisajes abiertos.

          Es un entorno cómodo para empezar: acceso fácil, rutas cortas y mucha variedad. Desde aquí se conecta con el valle de Benasque y con la Ribagorza, de modo que se pueden juntar dos actividades en el mismo fin de semana. Si dudas por dónde empezar, te propongo un plan según tu nivel y el parte del día.
      - titulo: Ribagorza
        texto: |
          La Ribagorza es la parte más suave y soleada del Pirineo, con barrancos de aguas claras, pueblos de piedra y rutas de media montaña que se pueden hacer casi todo el año. Aquí bajamos los barrancos más divertidos del verano, con toboganes, saltos y rápeles.

          También hago rutas por los valles bajos cuando arriba el tiempo no acompaña: son un buen plan alternativo y muy agradecido para quien quiere probar la montaña sin altura. El acceso desde Benasque es cómodo y permite combinar varias zonas en un mismo viaje. Cuéntame cuántos sois y qué os apetece, y preparo la salida.
      - titulo: Valle de Arán
        texto: |
          Para quien quiere cambiar de aires, también guío en el Valle de Arán, al otro lado del puerto. Es un valle verde y húmedo, con bosques, lagos de montaña y pueblos de piedra y pizarra, muy distinto del lado de Benasque. Aquí trabajo sobre todo con salidas privadas: rutas de senderismo, raquetas en invierno y jornadas a medida para grupos que ya vienen por la zona.

          Como no es mi valle de cada día, prefiero preparar cada salida con calma. Cuéntame cuántos sois, qué época preferís y qué habéis hecho antes, y te propongo un plan con el parte y el estado del terreno bien mirados.

