  preguntas:
    activa: true
    antetitulo: Preguntas
    titulo: Antes de reservar
    preguntas:
      - { pregunta: "¿Necesito experiencia?", respuesta: "Para las actividades de iniciación, no. Para las ascensiones y el esquí de travesía te pregunto qué has hecho antes y te recomiendo la más adecuada." }
      - { pregunta: "¿A partir de qué edad se puede venir?", respuesta: "Senderismo, raquetas y escalada, desde los ocho años acompañados de un adulto. Barrancos, desde los doce. Ascensiones, mayores de edad o con permiso." }
      - { pregunta: "¿Cómo se reserva y se paga?", respuesta: "Me escribes, te confirmo la plaza y pagas una señal por transferencia o Bizum. El resto, el día de la actividad." }
      - { pregunta: "¿Hacéis salidas privadas?", respuesta: "Sí. Para tu grupo, tu familia o tu empresa, en la fecha que elijas y con la actividad que quieras." }
      - { pregunta: "¿Dónde quedamos?", respuesta: "En Benasque o en el punto de inicio de la ruta. Al reservar te mando la ubicación y la hora por WhatsApp." }

